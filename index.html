<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Scientific Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculator" id="calc">
  <div class="keyboard" id="keyboard">
    <button class="btn" onclick="press('sin(')">sin</button>
    <button class="btn" onclick="press('cos(')">cos</button>
    <button class="btn" onclick="press('tan(')">tan</button>
    <button class="btn" onclick="press('log(')">log</button>
    <button class="btn" onclick="press('sqrt(')">√</button>
    <button class="btn" onclick="press('pi')">π</button>
    <button class="btn" onclick="press('e')">e</button>
    <button class="btn" onclick="press('^')">x^y</button>
    <button class="btn" onclick="press('7')">7</button>
    <button class="btn" onclick="press('8')">8</button>
    <button class="btn" onclick="press('9')">9</button>
    <button class="btn op" onclick="press('/')">÷</button>
    <button class="btn" onclick="press('4')">4</button>
    <button class="btn" onclick="press('5')">5</button>
    <button class="btn" onclick="press('6')">6</button>
    <button class="btn op" onclick="press('*')">×</button>
    <button class="btn" onclick="press('1')">1</button>
    <button class="btn" onclick="press('2')">2</button>
    <button class="btn" onclick="press('3')">3</button>
    <button class="btn op" onclick="press('-')">−</button>
    <button class="btn" onclick="press('0')">0</button>
    <button class="btn" onclick="press('.')">.</button>
    <button class="btn equal" onclick="calculate()">=</button>
    <button class="btn op" onclick="press('+')">+</button>
    <button class="btn" onclick="press(')">(</button>
    <button class="btn" onclick="press('(')">)</button>
     <button class="btn clear" onclick="backspace()">⌫</button>
      <button class="btn clear" onclick="clearDisplay()">C</button>
 
  </div>
  <!-- FIX 1: display-box add kar diya -->
  <div class="display-box">
    <input type="text" id="display" readonly placeholder="0">
  </div>

 
  <div class="theme-bar">
    <input type="file" id="themeUpload" accept="image/*">
    <button id="resetTheme">Default</button>
  </div>
</div>

<audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>

<!-- GSAP CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="script.js"></script>
</body>
</html>
